<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Informe ProtecX</title>
<!--
  Informe autocontenido: sin fuentes, scripts ni imágenes externas, para que
  abrirlo no envíe nada a terceros. Los datos van como JSON y se pintan con
  textContent (nunca innerHTML), de modo que el contenido de un malware
  (nombres de proceso, líneas de comandos) no puede inyectar HTML.
-->
<style>
  :root {
    --paper: #EDF0F3; --panel: #FFFFFF; --ink: #16202A; --muted: #566472; --line: #D3DAE1;
    --accent: #0B5C6B; --ok: #2E7D4F;
    --critical: #A4161A; --high: #C2410C; --medium: #A16207; --low: #1D5FA8; --info: #5B6B7B;
    --on-seg: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F151B; --panel: #17202A; --ink: #E6EBF0; --muted: #94A2B0; --line: #2A3642;
      --accent: #5CC0D1; --ok: #4FA876;
      --critical: #FF7B7B; --high: #FF9A55; --medium: #E8BC45; --low: #72AEEB; --info: #8E9DAC;
      --on-seg: #0F151B;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1, h2, h3 { line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Cabecera */
  .head h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); }
  .host { display: flex; flex-wrap: wrap; gap: 0.25rem 2rem; margin: 0.75rem 0 0; }
  .host div { min-width: 7rem; }
  .host dt { font-size: 0.8rem; color: var(--muted); }
  .host dd { margin: 0; font-size: 0.95rem; overflow-wrap: anywhere; }

  /* Veredicto: lo primero y lo más grande */
  .verdict { margin: 2.25rem 0 2rem; }
  .verdict h2 { font-size: clamp(1.75rem, 4.2vw, 2.75rem); font-weight: 700; letter-spacing: -0.025em; max-width: 24ch; }
  .verdict p { margin: 0.6rem 0 0; color: var(--muted); max-width: 60ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 1.5rem; }
  .seg, .seg-ok {
    flex: var(--n, 1) 1 auto; min-width: 6.5rem; padding: 0.55rem 0.85rem;
    border: 0; border-radius: 4px; background: var(--c); color: var(--on-seg);
    font: inherit; font-weight: 600; text-align: left;
  }
  .seg { cursor: pointer; }
  .seg[aria-pressed="false"] { opacity: 0.45; }
  .seg-ok { --c: var(--ok); --on-seg: #fff; flex-basis: 100%; cursor: default; }
  .seg b { font-variant-numeric: tabular-nums; margin-left: 0.4rem; }

  /* Lista de hallazgos */
  .findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .finding {
    background: var(--panel); border-left: 4px solid var(--c); border-radius: 0 6px 6px 0;
    padding: 0.85rem 1rem;
  }
  .finding[hidden] { display: none; }
  .finding .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.75rem; }
  .finding .sev { color: var(--c); font-weight: 700; font-size: 0.9rem; }
  .finding h3 { font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
  .finding .src { margin-left: auto; font-size: 0.85rem; color: var(--muted); }
  .finding p { margin: 0.35rem 0 0; color: var(--muted); max-width: 70ch; }
  .finding details { margin-top: 0.5rem; }
  summary { cursor: pointer; font-size: 0.9rem; color: var(--accent); }
  .evidence { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; margin: 0.6rem 0 0; font-size: 0.85rem; }
  .evidence dt { color: var(--muted); }
  .evidence dd { margin: 0; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .plain { margin-top: 0.7rem; padding: 0.7rem 0.9rem; background: var(--bg, rgba(127,127,127,.08)); border-radius: 6px; max-width: 70ch; }
  .plain p { color: var(--ink); margin: 0.3rem 0 0; }
  .plain h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 0.6rem; }
  .plain h4:first-child { margin-top: 0; }
  .plain ol { margin: 0.3rem 0 0; padding-left: 1.3rem; color: var(--ink); }
  .subject { grid-template-columns: max-content 1fr; }
  .subject dd { font-family: inherit; }
  .badge-new { background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: .05em;
    padding: 0.1rem 0.45rem; border-radius: 999px; align-self: center; }
  .compare { margin: -0.75rem 0 1.5rem; max-width: 70ch; }
  .compare p { color: var(--ink); margin: 0 0 0.5rem; }
  .compare button { font: inherit; font-size: 0.9rem; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 6px; padding: 0.3rem 0.8rem; }
  .compare button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .compare ul { margin: 0.5rem 0 0; padding-left: 1.2rem; color: var(--muted); }
  .rec { color: var(--ink) !important; font-size: 0.92rem; }
  .none { color: var(--muted); padding: 1rem 0; }

  /* Secciones secundarias */
  section.block { margin-top: 2.5rem; }
  section.block > h2 { font-size: 1.15rem; margin-bottom: 0.75rem; }
  .warns { margin: 0; padding-left: 1.2rem; max-width: 70ch; }
  .warns li { margin: 0.25rem 0; }
  .inv { background: var(--panel); border-radius: 6px; margin-bottom: 0.5rem; padding: 0.7rem 1rem; }
  .inv summary { color: var(--ink); font-weight: 600; font-size: 1rem; }
  .inv summary span { color: var(--muted); font-weight: 400; margin-left: 0.5rem; }
  .inv .flagged { color: var(--c, var(--critical)); font-weight: 700; }
  tr.flag td { background: color-mix(in srgb, var(--c) 12%, transparent); }
  tr.flag td:first-child { white-space: nowrap; color: var(--c); font-weight: 700; box-shadow: inset 4px 0 0 var(--c); padding-left: 0.6rem; }
  .scroll { overflow-x: auto; margin-top: 0.6rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  th, td { text-align: left; padding: 0.3rem 0.75rem 0.3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  th { font-weight: 600; color: var(--muted); white-space: nowrap; }
  .note { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; max-width: 70ch; }

  @media print {
    body { background: #fff; }
    .seg { opacity: 1 !important; }
  }
</style>
</head>

<script>
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  const SEVERITIES = ['critical', 'high', 'medium', 'low', 'info'];
  const LABELS = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
  const MAX_ROWS = 500;

  // Crea un elemento. Los hijos de texto se insertan como texto, nunca como HTML.
  const h = (tag, props = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'class') el.className = value;
      else if (key === 'style') el.style.cssText = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (value === true) el.setAttribute(key, '');
      else if (value !== false && value != null) el.setAttribute(key, value);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
    return el;
  };
  const text = (v) => (typeof v === 'string' ? v : JSON.stringify(v));
  const when = (iso) => (iso ? new Date(iso).toLocaleString('es-ES') : '—');
  const sevVar = (sev) => `--c: var(--${sev})`;

  const counts = data.counts;
  const total = SEVERITIES.reduce((n, s) => n + counts[s], 0);
  const seconds = Math.max(0, Math.round((new Date(data.finished_at) - new Date(data.started_at)) / 1000));

  function verdict() {
    if (counts.critical) return [counts.critical === 1 ? 'Se encontró una amenaza crítica' : `Se encontraron ${counts.critical} amenazas críticas`,
      'Conviene actuar ahora: desconecta el equipo de la red y revisa primero los hallazgos críticos.'];
    if (counts.high) return ['Hay indicios graves que revisar',
      'Algo se comporta como lo haría un ataque. Comprueba los hallazgos de gravedad alta antes de seguir usando el equipo con normalidad.'];
    if (counts.medium) return ['Hay elementos sospechosos',
      'Es probable que tengan una explicación legítima, pero conviene comprobarlos uno a uno.'];
    if (total) return ['Sin amenazas conocidas, con avisos menores',
      'Solo se registraron observaciones de baja gravedad.'];
    return ['No se encontraron amenazas conocidas',
      'No hubo coincidencias con las firmas ni conductas sospechosas en lo que se pudo analizar.'];
  }

  function header() {
    const items = [
      ['Equipo', data.host.hostname], ['Sistema', data.host.os], ['Usuario', data.host.user],
      ['Privilegios', data.host.admin ? 'Administrador' : 'Limitados'],
      ['Fecha', when(data.started_at)], ['Duración', `${seconds} s`],
      ['Firmas', `${data.signatures.hashes.toLocaleString('es-ES')} hashes, ${data.signatures.iocs.toLocaleString('es-ES')} IOCs`],
      ['Última actualización', when(data.signatures.last_update)],
    ];
    return h('header', { class: 'head' }, h('h1', {}, 'Informe de análisis ProtecX'),
      h('dl', { class: 'host' }, items.map(([k, v]) => h('div', {}, h('dt', {}, k), h('dd', {}, v)))));
  }

  function verdictBlock(onFilter) {
    const [title, sub] = verdict();
    const bar = h('div', { class: 'bar', role: 'group', 'aria-label': 'Filtrar hallazgos por gravedad' });
    if (!total) bar.append(h('div', { class: 'seg-ok' }, 'Sin hallazgos'));
    for (const sev of SEVERITIES.filter((s) => counts[s])) {
      const button = h('button', { class: 'seg', type: 'button', 'aria-pressed': 'true', 'data-sev': sev,
        style: `${sevVar(sev)}; --n: ${counts[sev]}` }, LABELS[sev], h('b', {}, counts[sev]));
      button.addEventListener('click', () => onFilter(sev));
      bar.append(button);
    }
    return h('section', { class: 'verdict' }, h('h2', {}, title), h('p', {}, sub), bar);
  }

  function findingItem(f) {
    const ex = f.explanation || {};
    const subject = Object.entries(f.subject || {});
    const plain = ex.que_es && h('div', { class: 'plain' },
      h('h4', {}, 'Qué significa'), h('p', {}, ex.que_es),
      h('h4', {}, 'Por qué importa'), h('p', {}, ex.por_que),
      h('h4', {}, 'Qué hacer'), h('ol', {}, (ex.que_hacer || []).map((step) => h('li', {}, step))),
      subject.length > 0 && h('h4', {}, 'Sobre este archivo o programa'),
      subject.length > 0 && h('dl', { class: 'evidence subject' },
        subject.map(([k, v]) => [h('dt', {}, k), h('dd', {}, text(v))])));
    const evidence = Object.entries(f.evidence || {}).filter(([, v]) => v !== '' && v != null);
    const details = (evidence.length || f.recommendation) && h('details', {},
      h('summary', {}, 'Detalles técnicos'),
      evidence.length > 0 && h('dl', { class: 'evidence' }, evidence.map(([k, v]) => [h('dt', {}, k), h('dd', {}, text(v))])),
      f.recommendation && h('p', { class: 'rec' }, f.recommendation));
    return h('li', { class: 'finding', 'data-sev': f.severity, 'data-new': f.is_new ? '1' : '0', style: sevVar(f.severity) },
      h('div', { class: 'top' }, h('span', { class: 'sev' }, f.severity_label), f.is_new && h('span', { class: 'badge-new' }, 'NUEVO'), h('h3', {}, f.title),
        h('span', { class: 'src' }, data.scanner_labels[f.scanner] || f.scanner)),
      plain, details);
  }

  function inventory(key, rows) {
    const columns = Object.keys(rows[0] || {});
    const shown = rows.slice(0, MAX_ROWS);
    const flagged = rows.filter((r) => r.alerta).length;
    const sevOf = (label) => (data.severity_by_label || {})[label] || 'info';
    return h('details', { class: 'inv', open: flagged > 0 },
      h('summary', {}, data.inventory_titles[key] || key, h('span', {}, `${rows.length} entradas`),
        flagged > 0 && h('span', { class: 'flagged' }, `${flagged} sospechosa${flagged > 1 ? 's' : ''}`)),
      h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, columns.map((c) => h('th', {}, c)))),
        h('tbody', {}, shown.map((row) => h('tr', row.alerta ? { class: 'flag', style: sevVar(sevOf(row.alerta)) } : {},
          columns.map((c) => h('td', {}, text(row[c] ?? '')))))))),
        rows.length > MAX_ROWS && h('p', { class: 'none' }, `Se muestran ${MAX_ROWS} de ${rows.length}. El JSON contiene todas.`));
  }

  const app = document.getElementById('app');
  const list = h('ol', { class: 'findings' }, data.findings.map(findingItem));
  const empty = h('p', { class: 'none', hidden: true }, 'Ningún hallazgo coincide con el filtro.');
  const active = new Set(SEVERITIES);
  let onlyNew = false;

  function compareBlock(onToggle) {
    const c = data.comparison;
    if (!c || !c.previous) return null;
    const button = h('button', { type: 'button', 'aria-pressed': 'false' }, 'Mostrar solo los nuevos');
    button.addEventListener('click', () => { button.setAttribute('aria-pressed', String(onToggle())); });
    return h('section', { class: 'compare' },
      h('p', {}, `Desde el análisis del ${when(c.previous)}: `, h('b', {}, `${c.new} ${c.new === 1 ? 'nuevo' : 'nuevos'}`),
        `, ${c.unchanged} sin cambios y `, h('b', {}, `${c.resolved.length} ${c.resolved.length === 1 ? 'resuelto' : 'resueltos'}`), '.'),
      c.new > 0 && button,
      c.resolved.length > 0 && h('details', {}, h('summary', {}, 'Ver los resueltos'),
        h('ul', {}, c.resolved.map((r) => h('li', {}, `${r.severity_label}: ${r.title}`)))));
  }

  function applyFilter(sev) {
    // Un clic aísla esa gravedad; otro clic sobre la única activa vuelve a mostrar todas.
    if (active.size === 1 && active.has(sev)) SEVERITIES.forEach((s) => active.add(s));
    else { active.clear(); active.add(sev); }
    const filtering = active.size < SEVERITIES.length;
    document.querySelectorAll('.seg').forEach((b) => b.setAttribute('aria-pressed', String(!filtering || active.has(b.dataset.sev))));
    refresh();
  }

  function refresh() {
    let visible = 0;
    list.querySelectorAll('.finding').forEach((li) => {
      const show = active.has(li.dataset.sev) && (!onlyNew || li.dataset.new === '1');
      li.hidden = !show; visible += show;
    });
    empty.hidden = visible > 0 || !total;
  }

  app.append(header(), verdictBlock(applyFilter), compareBlock(() => { onlyNew = !onlyNew; refresh(); return onlyNew; }));
  if (total) app.append(h('section', {}, list, empty));

  if (data.warnings.length) app.append(h('section', { class: 'block' }, h('h2', {}, 'Avisos del análisis'),
    h('ul', { class: 'warns' }, data.warnings.map((w) => h('li', {}, w)))));

  const inventoryKeys = Object.keys(data.inventory).filter((k) => data.inventory[k].length);
  if (inventoryKeys.length) app.append(h('section', { class: 'block' }, h('h2', {}, 'Qué hay en el equipo'),
    inventoryKeys.map((k) => inventory(k, data.inventory[k]))));

  app.append(h('p', { class: 'note' }, 'Un análisis sin hallazgos no garantiza que el equipo esté limpio. ProtecX compara con listas públicas y reglas de comportamiento; no sustituye a un antivirus residente ni analiza en tiempo real.'));

  window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach((d) => { d.open = true; }));
})();
</script>
