<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Informe ProtecX</title>
<!--
  Informe autocontenido: sin fuentes, scripts ni imágenes externas, para que
  abrirlo no envíe nada a terceros. Los datos van como JSON y se pintan con
  textContent (nunca innerHTML), de modo que el contenido de un malware
  (nombres de proceso, líneas de comandos) no puede inyectar HTML.
-->
<style>
  :root {
    --paper: #EDF0F3; --panel: #FFFFFF; --ink: #16202A; --muted: #566472; --line: #D3DAE1;
    --accent: #0B5C6B; --ok: #2E7D4F;
    --critical: #A4161A; --high: #C2410C; --medium: #A16207; --low: #1D5FA8; --info: #5B6B7B;
    --on-seg: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F151B; --panel: #17202A; --ink: #E6EBF0; --muted: #94A2B0; --line: #2A3642;
      --accent: #5CC0D1; --ok: #4FA876;
      --critical: #FF7B7B; --high: #FF9A55; --medium: #E8BC45; --low: #72AEEB; --info: #8E9DAC;
      --on-seg: #0F151B;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1, h2, h3 { line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Cabecera */
  .head h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); }
  .host { display: flex; flex-wrap: wrap; gap: 0.25rem 2rem; margin: 0.75rem 0 0; }
  .host div { min-width: 7rem; }
  .host dt { font-size: 0.8rem; color: var(--muted); }
  .host dd { margin: 0; font-size: 0.95rem; overflow-wrap: anywhere; }

  /* Veredicto: lo primero y lo más grande */
  .verdict { margin: 2.25rem 0 2rem; }
  .verdict h2 { font-size: clamp(1.75rem, 4.2vw, 2.75rem); font-weight: 700; letter-spacing: -0.025em; max-width: 24ch; }
  .verdict p { margin: 0.6rem 0 0; color: var(--muted); max-width: 60ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 1.5rem; }
  .seg, .seg-ok {
    flex: var(--n, 1) 1 auto; min-width: 6.5rem; padding: 0.55rem 0.85rem;
    border: 0; border-radius: 4px; background: var(--c); color: var(--on-seg);
    font: inherit; font-weight: 600; text-align: left;
  }
  .seg { cursor: pointer; }
  .seg[aria-pressed="false"] { opacity: 0.45; }
  .seg-ok { --c: var(--ok); --on-seg: #fff; flex-basis: 100%; cursor: default; }
  .seg b { font-variant-numeric: tabular-nums; margin-left: 0.4rem; }

  /* Lista de hallazgos */
  .findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .finding {
    background: var(--panel); border-left: 4px solid var(--c); border-radius: 0 6px 6px 0;
    padding: 0.85rem 1rem;
  }
  .finding[hidden] { display: none; }
  .finding .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.75rem; }
  .finding .sev { color: var(--c); font-weight: 700; font-size: 0.9rem; }
  .finding h3 { font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
  .finding .src { margin-left: auto; font-size: 0.85rem; color: var(--muted); }
  .finding p { margin: 0.35rem 0 0; color: var(--muted); max-width: 70ch; }
  .finding details { margin-top: 0.5rem; }
  summary { cursor: pointer; font-size: 0.9rem; color: var(--accent); }
  .evidence { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; margin: 0.6rem 0 0; font-size: 0.85rem; }
  .evidence dt { color: var(--muted); }
  .evidence dd { margin: 0; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .rec { color: var(--ink) !important; font-size: 0.92rem; }
  .none { color: var(--muted); padding: 1rem 0; }

  /* Secciones secundarias */
  section.block { margin-top: 2.5rem; }
  section.block > h2 { font-size: 1.15rem; margin-bottom: 0.75rem; }
  .warns { margin: 0; padding-left: 1.2rem; max-width: 70ch; }
  .warns li { margin: 0.25rem 0; }
  .inv { background: var(--panel); border-radius: 6px; margin-bottom: 0.5rem; padding: 0.7rem 1rem; }
  .inv summary { color: var(--ink); font-weight: 600; font-size: 1rem; }
  .inv summary span { color: var(--muted); font-weight: 400; margin-left: 0.5rem; }
  .scroll { overflow-x: auto; margin-top: 0.6rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  th, td { text-align: left; padding: 0.3rem 0.75rem 0.3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  th { font-weight: 600; color: var(--muted); white-space: nowrap; }
  .note { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; max-width: 70ch; }

  @media print {
    body { background: #fff; }
    .seg { opacity: 1 !important; }
  }
</style>
</head>

    for (const sev of SEVERITIES.filter((s) => counts[s])) {
      const button = h('button', { class: 'seg', type: 'button', 'aria-pressed': 'true', 'data-sev': sev,
        style: `${sevVar(sev)}; --n: ${counts[sev]}` }, LABELS[sev], h('b', {}, counts[sev]));
      button.addEventListener('click', () => onFilter(sev));
      bar.append(button);
    }
    return h('section', { class: 'verdict' }, h('h2', {}, title), h('p', {}, sub), bar);
  }

  function findingItem(f) {
    const evidence = Object.entries(f.evidence || {}).filter(([, v]) => v !== '' && v != null);
    const details = (evidence.length || f.recommendation) && h('details', {},
      h('summary', {}, 'Evidencia y recomendación'),
      evidence.length && h('dl', { class: 'evidence' }, evidence.map(([k, v]) => [h('dt', {}, k), h('dd', {}, text(v))])),
      f.recommendation && h('p', { class: 'rec' }, f.recommendation));
    return h('li', { class: 'finding', 'data-sev': f.severity, style: sevVar(f.severity) },
      h('div', { class: 'top' }, h('span', { class: 'sev' }, f.severity_label), h('h3', {}, f.title),
        h('span', { class: 'src' }, data.scanner_labels[f.scanner] || f.scanner)),
      f.detail && h('p', {}, f.detail), details);
  }

  function inventory(key, rows) {
    const columns = Object.keys(rows[0] || {});
    const shown = rows.slice(0, MAX_ROWS);
    return h('details', { class: 'inv' },
      h('summary', {}, data.inventory_titles[key] || key, h('span', {}, `${rows.length} entradas`)),
      h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, columns.map((c) => h('th', {}, c)))),
        h('tbody', {}, shown.map((row) => h('tr', {}, columns.map((c) => h('td', {}, text(row[c] ?? ''))))))),
        rows.length > MAX_ROWS && h('p', { class: 'none' }, `Se muestran ${MAX_ROWS} de ${rows.length}. El JSON contiene todas.`)));
  }

  const app = document.getElementById('app');
  const list = h('ol', { class: 'findings' }, data.findings.map(findingItem));
  const empty = h('p', { class: 'none', hidden: true }, 'Ningún hallazgo coincide con el filtro.');
  const active = new Set(SEVERITIES);

  function applyFilter(sev) {
    // Un clic aísla esa gravedad; otro clic sobre la única activa vuelve a mostrar todas.
    if (active.size === 1 && active.has(sev)) SEVERITIES.forEach((s) => active.add(s));
    else { active.clear(); active.add(sev); }
    const filtering = active.size < SEVERITIES.length;
    document.querySelectorAll('.seg').forEach((b) => b.setAttribute('aria-pressed', String(!filtering || active.has(b.dataset.sev))));
    let visible = 0;
    list.querySelectorAll('.finding').forEach((li) => { const show = active.has(li.dataset.sev); li.hidden = !show; visible += show; });
    empty.hidden = visible > 0 || !total;
  }

  app.append(header(), verdictBlock(applyFilter));
  if (total) app.append(h('section', {}, list, empty));

  if (data.warnings.length) app.append(h('section', { class: 'block' }, h('h2', {}, 'Avisos del análisis'),
    h('ul', { class: 'warns' }, data.warnings.map((w) => h('li', {}, w)))));

  const inventoryKeys = Object.keys(data.inventory).filter((k) => data.inventory[k].length);
  if (inventoryKeys.length) app.append(h('section', { class: 'block' }, h('h2', {}, 'Qué hay en el equipo'),
    inventoryKeys.map((k) => inventory(k, data.inventory[k]))));

  app.append(h('p', { class: 'note' }, 'Un análisis sin hallazgos no garantiza que el equipo esté limpio. ProtecX compara con listas públicas y reglas de comportamiento; no sustituye a un antivirus residente ni analiza en tiempo real.'));

  window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach((d) => { d.open = true; }));
})();
</script>
</body>
</html>
